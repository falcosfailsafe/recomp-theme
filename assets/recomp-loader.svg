<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="hud-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neon-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark HUD disc -->
  <rect width="120" height="120" rx="22" fill="#080b12"/>

  <!-- Corner HUD targeting brackets -->
  <path d="M16 32V16h16M88 16h16v16M104 88v16H88M32 104H16V88" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Outer segmented targeting ring -->
  <g filter="url(#neon-glow)">
    <circle cx="60" cy="60" r="41" stroke="url(#hud-grad)" stroke-width="3.5" stroke-dasharray="32 14 10 14" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="1.8s" repeatCount="indefinite"/>
  </g>

  <!-- Inner counter-rotating ring -->
  <g>
    <circle cx="60" cy="60" r="31" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.75"/>
    <animateTransform attributeName="transform" type="rotate" from="360 60 60" to="0 60 60" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- Classic Console D-Pad -->
  <g filter="url(#neon-glow)">
    <path d="M55 39 H65 Q68 39 68 42 V52 H78 Q81 52 81 55 V65 Q81 68 78 68 H68 V78 Q68 81 65 81 H55 Q52 81 52 78 V68 H42 Q39 68 39 65 V55 Q39 52 42 52 H52 V42 Q52 39 55 39 Z" fill="#111827" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Center pivot recess -->
    <circle cx="60" cy="60" r="4.5" fill="#080b12" stroke="#38bdf8" stroke-width="1.6"/>
    <!-- Directional arrows -->
    <path d="M60 43 L56.8 48 H63.2 Z" fill="#22d3ee">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.2s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M77 60 L72 56.8 V63.2 Z" fill="#22d3ee">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M60 77 L56.8 72 H63.2 Z" fill="#22d3ee">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M43 60 L48 56.8 V63.2 Z" fill="#22d3ee">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>

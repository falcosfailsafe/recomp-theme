<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="recomp-splash-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="recomp-splash-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .recomp-splash-brackets {
      animation: recomp-splash-pulse 1.8s ease-in-out infinite;
    }
    .recomp-splash-ring-outer {
      transform-box: view-box;
      transform-origin: 60px 60px;
      animation: recomp-splash-spin-cw 1.8s linear infinite;
    }
    .recomp-splash-ring-inner {
      transform-box: view-box;
      transform-origin: 60px 60px;
      animation: recomp-splash-spin-ccw 3.2s linear infinite;
    }
    .recomp-splash-arrow {
      animation: recomp-splash-dir 1.2s ease-in-out infinite;
    }
    .recomp-splash-arrow--r { animation-delay: 0.3s; }
    .recomp-splash-arrow--d { animation-delay: 0.6s; }
    .recomp-splash-arrow--l { animation-delay: 0.9s; }

    @keyframes recomp-splash-spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes recomp-splash-spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes recomp-splash-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes recomp-splash-dir {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Corner HUD targeting brackets -->
  <path class="recomp-splash-brackets" d="M16 32V16h16M88 16h16v16M104 88v16H88M32 104H16V88" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer segmented targeting ring -->
  <g class="recomp-splash-ring-outer" filter="url(#recomp-splash-glow)">
    <circle cx="60" cy="60" r="41" stroke="url(#recomp-splash-grad)" stroke-width="3.5" stroke-dasharray="32 14 10 14" stroke-linecap="round"/>
  </g>

  <!-- Inner counter-rotating ring -->
  <g class="recomp-splash-ring-inner">
    <circle cx="60" cy="60" r="31" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Classic Console D-Pad -->
  <g filter="url(#recomp-splash-glow)">
    <path d="M55 39 H65 Q68 39 68 42 V52 H78 Q81 52 81 55 V65 Q81 68 78 68 H68 V78 Q68 81 65 81 H55 Q52 81 52 78 V68 H42 Q39 68 39 65 V55 Q39 52 42 52 H52 V42 Q52 39 55 39 Z" fill="#111827" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="4.5" fill="#080b12" stroke="#38bdf8" stroke-width="1.6"/>
    <path class="recomp-splash-arrow" d="M60 43 L56.8 48 H63.2 Z" fill="#22d3ee"/>
    <path class="recomp-splash-arrow recomp-splash-arrow--r" d="M77 60 L72 56.8 V63.2 Z" fill="#22d3ee"/>
    <path class="recomp-splash-arrow recomp-splash-arrow--d" d="M60 77 L56.8 72 H63.2 Z" fill="#22d3ee"/>
    <path class="recomp-splash-arrow recomp-splash-arrow--l" d="M43 60 L48 56.8 V63.2 Z" fill="#22d3ee"/>
  </g>
</svg>
